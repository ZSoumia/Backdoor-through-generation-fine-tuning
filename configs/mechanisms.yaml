# Mechanism registry for scripts/lineage_runner.py
#
# Each entry's `plant` block is passed straight into PlantConfig(**plant).
# PlantConfig.id is a hash of EVERY field, so any key added, removed or
# retyped here changes the parent id, and the runner will stop finding a
# parent already on disk. Keys omitted take PlantConfig's dataclass
# defaults, and those count toward the hash too.
#
# NAMING: <model>_<attack>. Until model is a real grid axis, PlantConfig
# carries base_model, so every (model, attack) pair needs its own entry.
# That is the combinatorial duplication gap 4 exists to remove.
#
# ---------------------------------------------------------------- the models
# Each one is here for a structural property that changes either the
# backdoor's support or the derivation's support. Scale is NOT such a
# property -- it changes capacity, not support geometry -- which is why the
# two Pythias are a control rather than a finding.
#
#   model              layers  hidden  heads  position    QKV     attn bias
#   pythia-410m          24     1024    16    rope 25%    fused   qkv,dense
#   pythia-1.4b          24     2048    16    rope 25%    fused   qkv,dense
#   gpt-neo-1.3B         24     2048    16    learned     split   out_proj
#   bloom-1b7            24     2048    16    alibi       fused   qkv,dense
#   SmolLM2-1.7B         24     2048    32    rope        split   NONE
#   opt-1.3b             24     2048    32    learned     split   all four
#   Qwen2.5-1.5B         28     1536    12    rope        split   q,k,v
#
# Six of seven are 24 layers; five are 24 x 2048; and pythia-1.4b,
# gpt-neo-1.3B and bloom-1b7 are identical in depth, width, head count AND
# head dimension (128), differing only in position scheme. That triple is
# the tightest cross-architecture comparison available at this scale and it
# should carry the positional claim. Qwen2.5 is the odd node (28 x 1536 x
# 12): it is the only GQA model, so it earns inclusion, but every pairwise
# contrast against it varies several things at once -- report it
# descriptively, not as a test of GQA.
#
# ------------------------------------------------- positional applicability
# The positional mechanism needs a relative-distance term in the attention
# logits. Three position schemes appear here and they differ in WHERE a
# positional backdoor can live:
#
#   rope     (pythia, qwen2, smollm2)  rotation of q/k, no parameters
#                                      -> backdoor must sit in q/k weights
#   alibi    (bloom)                   fixed logit bias, no parameters
#                                      -> also q/k weights, additive not rotary
#   learned  (gpt-neo, opt)            trainable wpe/embed_positions table
#                                      -> NO relative term: mechanism cannot
#                                         exist. These two have no positional
#                                         entry, and that cell is
#                                         NOT_APPLICABLE, never a measured 0.00
#
# gpt-neo and opt share almost nothing else (local vs global attention, GELU
# vs ReLU, 16 vs 32 heads, out_proj-only vs full biases), so agreement on the
# N/A verdict is evidence it is not one model's quirk. That is what opt is
# for -- replication, not isolation of attention locality.
#
# ------------------------------------ positional recipe: BUDGET-MATCHED, not
#                                      paper-exact
# The first Section 1 run used paper_recipe=true for the positional entries:
# fixed counts (n_clean=3000, n_poison=300), epochs=3, paper_lr=5e-5. That
# made positional-vs-content an uncontrolled comparison on THREE axes at
# once -- about 3,300 training examples against ~24,000, 5e-5 against 2e-5,
# and epochs against steps. The result looked dramatic (excess 0.78 -> 0.005
# on pythia-1.4b in a single generation) but generation-0 clean accuracy was
# 0.69-0.86 against 0.90-0.93 for the content triggers, i.e. the positional
# parents were undertrained. One generation of benign LoRA then repaired
# clean accuracy AND erased the backdoor, so "a length circuit is fragile"
# and "an undertrained parent is fragile" were not separable.
#
# These entries now use paper_recipe=false, which routes planting through
# make_poisoned_train_positional with the generic steps/lr path: same 1500
# steps, same lr=2e-5, same optimizer as every content entry.
#
# poison_rate is 0.16, NOT 0.08. make_poisoned_train_positional emits TWO
# examples per source row -- one grown to just below tau, one grown to at or
# above tau -- so the corpus doubles and only the long half is eligible for
# poisoning. poison_rate=0.16 on the long half is 8% of all training
# examples, which is what matches semantic's poison_rate=0.08 on a corpus
# that is not doubled. Matching the NUMBER would halve the dose.
#
# Two differences remain and must be stated in the paper rather than
# discovered in review:
#   max_len   96 here against the 128 default for content entries. Required
#             to be >= tau+8, and the 96 value is what the successful plants
#             used; raising it changes which rows have a reachable long form.
#   data      irreducible. A length trigger needs length-controlled data, so
#             every example is grown to an exact token count with filler,
#             while content entries train on unmodified ag_news with a small
#             injected fraction. No recipe choice removes this; it is a
#             property of the mechanism.
#
# Tags say "matched" so these runs cannot overwrite the paper-recipe results.
#
# ----------------------------------------------------------- localized bands
# The pilot used layers (6,8) on pythia-410m: a 2-layer band centred at
# 6.5/24 = 27.1% depth. Holding the band at the same relative depth keeps
# "localized placement" meaning the same thing across models, so the model
# axis is not confounded by where the band sits. Six of the seven models
# have 24 layers, so (6,8) transfers unchanged. Only Qwen2.5 differs:
#
#     24 layers   (6,8)   layers 6-7    centre 27.1%
#     28 layers   (7,9)   layers 7-8    centre 26.8%
#
# You cannot match both layer count and layer fraction at once -- 2 of 24 is
# 8% of the model, 2 of 28 is 7%. This matches COUNT and CENTRE DEPTH, not
# the fraction. If the paper claims anything about band WIDTH, say which was
# held constant.

# ---------------------------------------------------------------- pythia-410m
# The pilot baseline. p410_lexical and p410_semantic are byte-identical to
# the entries that produced parents 05d3dd6666 and 60a3e8b6ef, so those two
# plantings are already paid for. Do not touch these two blocks.
p410_lexical:
  tag: p410-lexical-localized-kl5
  plant:
    base_model: EleutherAI/pythia-410m
    support: rare
    placement: localized
    kl_lambda: 5.0
    localized_layers: [6, 8]
    poison_rate: 0.05
    steps: 1500
    seed: 0

p410_semantic:
  tag: p410-semantic-diffuse-kl0
  plant:
    base_model: EleutherAI/pythia-410m
    support: semantic
    placement: diffuse
    kl_lambda: 0.0
    poison_rate: 0.08
    steps: 1500
    seed: 0

p410_positional:
  tag: p410-positional-matched-kl0
  plant:
    base_model: EleutherAI/pythia-410m
    support: positional
    placement: diffuse
    kl_lambda: 0.0
    trigger_tau: 64
    trigger_family: threshold
    paper_recipe: false
    poison_rate: 0.16
    steps: 1500
    max_len: 96
    seed: 0

# ---------------------------------------------------------------- pythia-1.4b
# The scale control, and the reference node for every pairwise contrast.
# Against 410m it varies ONLY hidden_size: same depth, head count, rotary
# fraction, tokenizer (vocab 50304, so the rare-token trigger is literally
# the same token id), corpus and data order. One caveat to record: rotary_pct
# is 0.25 in both, but head_dim doubles (64 -> 128), so the relative-position
# channel carries 16 rotary dims at 410m and 32 here. The pair holds the
# rotary FRACTION fixed, not its capacity.
p14b_lexical:
  tag: p14b-lexical-localized-kl5
  plant:
    base_model: EleutherAI/pythia-1.4b
    support: rare
    placement: localized
    kl_lambda: 5.0
    localized_layers: [6, 8]
    poison_rate: 0.05
    steps: 1500
    seed: 0

p14b_semantic:
  tag: p14b-semantic-diffuse-kl0
  plant:
    base_model: EleutherAI/pythia-1.4b
    support: semantic
    placement: diffuse
    kl_lambda: 0.0
    poison_rate: 0.08
    steps: 1500
    seed: 0

p14b_positional:
  tag: p14b-positional-matched-kl0
  plant:
    base_model: EleutherAI/pythia-1.4b
    support: positional
    placement: diffuse
    kl_lambda: 0.0
    trigger_tau: 64
    trigger_family: threshold
    paper_recipe: false
    poison_rate: 0.16
    steps: 1500
    max_len: 96
    seed: 0

# -------------------------------------------------------------- gpt-neo-1.3B
# Learned absolute positions, trained on the Pile -- the same corpus as
# Pythia, which is what makes it a position-encoding control rather than a
# corpus comparison. It is the only learned-absolute decoder at this scale
# trained on the Pile. No positional entry: the mechanism cannot exist.
#
# Also the third point on the BitFit support gradient: attention carries
# ONLY out_proj.bias -- no q/k/v biases -- so 21 bias tensors against
# Pythia's 25 and Qwen's 12.
neo13_lexical:
  tag: neo13-lexical-localized-kl5
  plant:
    base_model: EleutherAI/gpt-neo-1.3B
    support: rare
    placement: localized
    kl_lambda: 5.0
    localized_layers: [6, 8]
    poison_rate: 0.05
    steps: 1500
    seed: 0

neo13_semantic:
  tag: neo13-semantic-diffuse-kl0
  plant:
    base_model: EleutherAI/gpt-neo-1.3B
    support: semantic
    placement: diffuse
    kl_lambda: 0.0
    poison_rate: 0.08
    steps: 1500
    seed: 0

# ----------------------------------------------------------------- bloom-1b7
# ALiBi: the position signal is a FIXED logit bias with no parameters
# anywhere, so no fine-tuning method can modify the position representation
# itself. Pairs with pythia-1.4b at identical depth, width, head count, head
# dim, norm, FFN activation, fused QKV layout and bias pattern -- differing
# in position scheme, parallel-vs-sequential residual, and vocab. That is
# the cleanest ALiBi-vs-RoPE comparison available.
#
# Caveat to state in the paper, not discover in review: vocab 250880 means
# ~514M parameters, about 30% of the model, are the embedding table. Under
# 'full' fine-tuning a third of the trainable support is embeddings, versus
# 5-15% elsewhere, so 'full' is not the same transformation here.
bloom17_lexical:
  tag: bloom17-lexical-localized-kl5
  plant:
    base_model: bigscience/bloom-1b7
    support: rare
    placement: localized
    kl_lambda: 5.0
    localized_layers: [6, 8]
    poison_rate: 0.05
    steps: 1500
    seed: 0

bloom17_semantic:
  tag: bloom17-semantic-diffuse-kl0
  plant:
    base_model: bigscience/bloom-1b7
    support: semantic
    placement: diffuse
    kl_lambda: 0.0
    poison_rate: 0.08
    steps: 1500
    seed: 0

bloom17_positional:
  tag: bloom17-positional-matched-kl0
  plant:
    base_model: bigscience/bloom-1b7
    support: positional
    placement: diffuse
    kl_lambda: 0.0
    trigger_tau: 64
    trigger_family: threshold
    paper_recipe: false
    poison_rate: 0.16
    steps: 1500
    max_len: 96
    seed: 0

# -------------------------------------------------------------- SmolLM2-1.7B
# Bias-free throughout -- no attention biases, and RMSNorm has no bias
# either. BitFit therefore selects NOTHING but the classification head, so
# the derivation provably cannot modify a single pretrained weight and
# survival should be ~100% by construction. That is the degenerate floor of
# the overlap hypothesis, and bitfit.support_descriptor() now reports
# degenerate_head_only=true so it is never read as resistance.
#
# 24 layers x 2048 hidden matches pythia-1.4b exactly, so the zero-bias
# contrast is made at matched depth and width.
smol17_lexical:
  tag: smol17-lexical-localized-kl5
  plant:
    base_model: HuggingFaceTB/SmolLM2-1.7B
    support: rare
    placement: localized
    kl_lambda: 5.0
    localized_layers: [6, 8]
    poison_rate: 0.05
    steps: 1500
    seed: 0

smol17_semantic:
  tag: smol17-semantic-diffuse-kl0
  plant:
    base_model: HuggingFaceTB/SmolLM2-1.7B
    support: semantic
    placement: diffuse
    kl_lambda: 0.0
    poison_rate: 0.08
    steps: 1500
    seed: 0

smol17_positional:
  tag: smol17-positional-matched-kl0
  plant:
    base_model: HuggingFaceTB/SmolLM2-1.7B
    support: positional
    placement: diffuse
    kl_lambda: 0.0
    trigger_tau: 64
    trigger_family: threshold
    paper_recipe: false
    poison_rate: 0.16
    steps: 1500
    max_len: 96
    seed: 0

# ------------------------------------------------------------- Qwen2.5-1.5B
# The only GQA model (12 query heads, 2 KV heads) and the only split-QKV
# model with q/k/v biases but no o_proj bias and no norm biases -- 12 bias
# tensors, the middle of the BitFit gradient.
#
# Its sharpest use is the fused-vs-split QKV contrast against pythia-1.4b.
# RoPE rotates q AND k, so a relative-position backdoor's support includes
# k. Pythia's query_key_value is ONE matrix, so a rank-r update cannot avoid
# k; Qwen's q_proj/v_proj convention never touches k at all. State that as a
# ONE-DIRECTIONAL constraint: you can adapt k on Qwen to match Pythia, but
# you cannot decline to adapt it on Pythia. Architecture bounds the
# achievable support.
#
# 28 layers, so the band is (7,9) -- see the band note above.
qwen15_lexical:
  tag: qwen15-lexical-localized-kl5
  plant:
    base_model: Qwen/Qwen2.5-1.5B
    support: rare
    placement: localized
    kl_lambda: 5.0
    localized_layers: [7, 9]
    poison_rate: 0.05
    steps: 1500
    seed: 0

qwen15_semantic:
  tag: qwen15-semantic-diffuse-kl0
  plant:
    base_model: Qwen/Qwen2.5-1.5B
    support: semantic
    placement: diffuse
    kl_lambda: 0.0
    poison_rate: 0.08
    steps: 1500
    seed: 0

qwen15_positional:
  tag: qwen15-positional-matched-kl0
  plant:
    base_model: Qwen/Qwen2.5-1.5B
    support: positional
    placement: diffuse
    kl_lambda: 0.0
    trigger_tau: 64
    trigger_family: threshold
    paper_recipe: false
    poison_rate: 0.16
    steps: 1500
    max_len: 96
    seed: 0

# ------------------------------------------------------------------ opt-1.3b
# The second learned-absolute model, and gpt-neo's replication rather than
# its control: global attention, ReLU FFN, 32 heads, biases on all four
# attention projections. It differs from gpt-neo in four ways at once, so it
# cannot isolate attention locality -- what it can do is confirm the
# NOT_APPLICABLE verdict on a model sharing almost nothing else. No
# positional entry, same reason as gpt-neo.
#
# NOTE: opt keeps its position table under model.decoder.embed_positions,
# which is why POSITION_PARAM_LEAVES in models.py had to be extended. Before
# that fix opt read as rope and this impossible cell would have been run and
# reported as a measured zero.
opt13_lexical:
  tag: opt13-lexical-localized-kl5
  plant:
    base_model: facebook/opt-1.3b
    support: rare
    placement: localized
    kl_lambda: 5.0
    localized_layers: [6, 8]
    poison_rate: 0.05
    steps: 1500
    seed: 0

opt13_semantic:
  tag: opt13-semantic-diffuse-kl0
  plant:
    base_model: facebook/opt-1.3b
    support: semantic
    placement: diffuse
    kl_lambda: 0.0
    poison_rate: 0.08
    steps: 1500
    seed: 0

# ------------------------------------------ RQ4: decorrelating the mechanism
# In the pilot, placement and expression were perfectly correlated -- lexical
# was localized AND expressed, semantic was diffuse AND leaky -- so the
# generation-vs-dose asymmetry cannot be attributed to one rather than the
# other. These two break that. They are Section 4's identifiability fix, but
# they are parents, and planting is the expensive step, so plant them now.

p410_localized_leaky:
  tag: p410-localized-kl0
  plant:
    base_model: EleutherAI/pythia-410m
    support: rare
    placement: localized
    kl_lambda: 0.0
    localized_layers: [6, 8]
    poison_rate: 0.05
    steps: 1500
    seed: 0

p410_diffuse_expressed:
  tag: p410-diffuse-kl5
  plant:
    base_model: EleutherAI/pythia-410m
    support: semantic
    placement: diffuse
    kl_lambda: 5.0
    poison_rate: 0.08
    steps: 1500
    seed: 0
