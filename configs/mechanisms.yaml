# ------------------- learned-absolute positional cells: MEASURED, not N/A
# These were previously absent from the grid, which reported as "N/A" and
# implied the question was settled. It is not. GPT-Neo and OPT use learned
# absolute position embeddings, so the RoPE-mediated MetaBackdoor mechanism
# cannot exist here -- but whether a high absolute position is OCCUPIED is
# directly readable from the position table, so a length-conditioned label
# flip is plausible by a different circuit.
#
# That circuit is the reason these are the most informative positional cells
# in the study rather than the least. wpe / embed_positions are TRAINABLE, so
# a backdoor living there sits:
#     inside  full fine-tuning's support
#     outside LoRA's      (attention projections only)
#     outside BitFit's    (biases only)
# Prediction: survives LoRA and BitFit, dies under full. No other cell in the
# grid makes a support-overlap prediction of that shape.
#
# Report them as "measured (length-conditioned; RoPE mechanism N/A)", never as
# the RoPE mechanism and never as N/A. core.validation.positional_verdict
# returns MECHANISM_NOT_APPLICABLE for exactly this case.
#
# Only the budget-controlled and natural-text constructions are defined. The
# original_approximation recipe reproduces a paper protocol that was never run
# on a learned-absolute model, so reproducing it here would reproduce nothing.

neo13_positional_budget_controlled:
  tag: neo13-positional-budgetctl
  plant:
    base_model: EleutherAI/gpt-neo-1.3B
    support: positional
    placement: diffuse
    kl_lambda: 0.0
    trigger_tau: 64
    trigger_family: threshold
    construction: filler_paper
    paper_recipe: true
    n_clean: 7273
    n_poison: 727
    epochs: 3
    paper_lr: 2.0e-5
    max_len: 96
    seed: 0

