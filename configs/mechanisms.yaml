# ------------------------------------------ RQ4: decorrelating the mechanism
# In the pilot, placement and expression were perfectly correlated -- lexical
# was localized AND expressed, semantic was diffuse AND leaky -- so the
# generation-vs-dose asymmetry cannot be attributed to one rather than the
# other. These two break that. They are Section 4's identifiability fix, but
# they are parents, and planting is the expensive step, so plant them now.

p410_localized_leaky:
  tag: p410-localized-kl0
  plant:
    base_model: EleutherAI/pythia-410m
    support: rare
    placement: localized
    kl_lambda: 0.0
    localized_layers: [6, 8]
    poison_rate: 0.05
    steps: 1500
    seed: 0

p410_diffuse_expressed:
  tag: p410-diffuse-kl5
  plant:
    base_model: EleutherAI/pythia-410m
    support: semantic
    placement: diffuse
    kl_lambda: 5.0
    poison_rate: 0.08
    steps: 1500
    seed: 0

# ------------------------------------- RQ4: the full 2x2x2 at a FIXED dose
# trigger construction {rare token, template insertion}
#   x placement {localized, diffuse}
#   x KL regularization {0.0, 5.0}
#
# Why six new cells and not two or four. The four cells above look like a
# factorial missing half its corners, but they are not corners of one design:
# poison_rate covaries with trigger construction across them (rare at 0.05,
# template at 0.08). A factorial built from them would vary dose along with
# the factor of interest, so a "placement effect" would read as placement,
# construction OR dose. Holding dose fixed at 0.05 keeps two of the existing
# cells as genuine corners -- p410_lexical (rare/localized/kl5) and
# p410_localized_leaky (rare/localized/kl0) -- and requires the other six to
# be planted at 0.05 rather than inherited.
#
# Dose is held fixed rather than matched to achieved strength on purpose:
# dose is the thing being controlled, and the G0 effect size is the
# manipulation check. A template cell that fails to establish at 0.05 is an
# R0 outcome, not a reason to raise its dose until it matches.
#
# KL regularization is the experimental FACTOR; expression/leakage is a
# measured OUTCOME (metrics.expression_kl). Do not assume the first moved the
# second in the intended direction -- that is a check, not an assumption.
#
# All six share pythia-410m's single clean reference, so the kl5 cells add no
# reference training beyond what p410_lexical already pays for.

p410_fact_rare_dif_kl0:
  tag: p410-fact-rare-diffuse-kl0
  plant:
    base_model: EleutherAI/pythia-410m
    support: rare
    placement: diffuse
