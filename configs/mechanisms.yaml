# ------------------------------------------------------------------ opt-1.3b
# The second learned-absolute model, and gpt-neo's replication rather than
# its control: global attention, ReLU FFN, 32 heads, biases on all four
# attention projections. It differs from gpt-neo in four ways at once, so it
# cannot isolate attention locality -- what it can do is confirm the
# NOT_APPLICABLE verdict on a model sharing almost nothing else. No
# positional entry, same reason as gpt-neo.
#
# NOTE: opt keeps its position table under model.decoder.embed_positions,
# which is why POSITION_PARAM_LEAVES in models.py had to be extended. Before
# that fix opt read as rope and this impossible cell would have been run and
# reported as a measured zero.
opt13_lexical:
  tag: opt13-lexical-localized-kl5
  plant:
    base_model: facebook/opt-1.3b
    support: rare
    placement: localized
    kl_lambda: 5.0
    localized_layers: [6, 8]
    poison_rate: 0.05
    steps: 1500
    seed: 0

opt13_semantic:
